<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marium's Scrapbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Young+Serif&display=swap">
<style>
:root{
  --sky1:#6fbdee; --sky2:#bfe3fa; --hole:#4a93c4; --ring:#e9f5ff;
  --paper:#fcfeff; --blue:#dff0fc; --ink:#1f3b57; --soft:#5a7a96; --sun:#ffd86b; --pink:#ffb8cc; --mint:#a8e6cf;
  --photo:#e6f3fd; --shadow:rgba(31,59,87,.3);
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive; --serif:'Young Serif',Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#17304f;--sky2:#2b5883;--hole:#0e1f35;}}
:root[data-theme="dark"]{--sky1:#17304f;--sky2:#2b5883;--hole:#0e1f35;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky1));background-attachment:fixed;color:var(--ink);font-family:var(--hand);font-size:1.3rem;line-height:1.35;overflow-x:hidden}
.cloud{position:absolute;width:140px;height:44px;background:#fff;border-radius:44px;opacity:.85;filter:drop-shadow(0 4px 6px rgba(31,59,87,.12));pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:62px;height:62px;left:22px;top:-30px}.cloud::after{width:48px;height:48px;left:68px;top:-20px}
main{max-width:980px;margin:0 auto;padding:2rem 1rem 4rem;position:relative}
h1,h2{font-family:var(--serif);font-weight:400;margin:0}

/* cover */
.cover{margin:1rem auto 3.5rem;max-width:620px;transform:rotate(-1.5deg);position:relative;
  background:var(--paper);padding:.9rem;box-shadow:0 12px 24px var(--shadow)}
.cover-in{padding:2rem 1.2rem 2.2rem;text-align:center;
  background:repeating-linear-gradient(0deg,rgba(111,189,238,.32) 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,rgba(111,189,238,.32) 0 14px,transparent 14px 28px),#fff;
  border:3px dashed var(--ink)}
.label{display:inline-block;background:var(--paper);padding:.6rem 2rem 1rem;box-shadow:0 3px 8px var(--shadow);transform:rotate(1.5deg);max-width:100%}
.label h1{font-size:clamp(2.6rem,10vw,4.8rem);line-height:1.05;outline:none}
.label p{margin:.2rem 0 0;font-size:1.6rem;color:var(--soft);outline:none}
.torn{position:relative}
.torn::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:linear-gradient(-45deg,transparent 7px,var(--paper) 0),linear-gradient(45deg,transparent 7px,var(--paper) 0);background-size:14px 14px;background-position:0 -4px}
.tape{position:absolute;width:105px;height:28px;opacity:.9;background-color:#bfe3fa;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px);box-shadow:0 1px 3px var(--shadow)}
.tape.y{background-color:var(--sun)}.tape.p{background-color:var(--pink)}.tape.m{background-color:var(--mint)}
.cover .tape{top:-12px;left:50%;margin-left:-52px;transform:rotate(-3deg)}
.sticker{position:absolute;font-size:2.6rem;line-height:1;filter:drop-shadow(0 3px 2px rgba(31,59,87,.3));user-select:none;pointer-events:none}

/* pages */
.page{position:relative;background:var(--paper);margin:0 0 3.2rem;padding:2.2rem 1.6rem 2.4rem 4rem;box-shadow:0 10px 22px var(--shadow),0 2px 0 rgba(255,255,255,.7) inset;transform:rotate(var(--pr,0deg))}
.page::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:30px;
  background:radial-gradient(circle,var(--hole) 6px,transparent 7px) center top/30px 44px repeat-y}
.page::after{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:38px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0 2px,var(--ring) 2px 3px,transparent 3px) 0 0/100% 100%}
.page.blue{background:var(--blue)}
.page.gingham{background:repeating-linear-gradient(0deg,rgba(111,189,238,.22) 0 16px,transparent 16px 32px),repeating-linear-gradient(90deg,rgba(111,189,238,.22) 0 16px,transparent 16px 32px),#fff}
.stitch{position:absolute;inset:8px 8px 8px 50px;border:2px dashed rgba(31,59,87,.35);pointer-events:none}
.sec-title{display:inline-block;font-size:1.7rem;margin:0 0 1.5rem;padding:.1rem .6rem;background:linear-gradient(transparent 45%,var(--sun) 45% 92%,transparent 92%);transform:rotate(-1deg)}
.hint{font-size:1.15rem;color:var(--soft);margin:-.9rem 0 1.5rem}

/* photos */
.photo{position:relative;background:var(--photo);border:2px dashed var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;text-align:center;color:var(--soft);cursor:pointer;overflow:hidden;aspect-ratio:1/1;width:100%;padding:.5rem}
.photo:hover,.photo:focus-visible{border-color:var(--ink);outline:none}
.photo:focus-visible{box-shadow:0 0 0 3px var(--sun)}
.photo svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.photo.filled{border:0;padding:0;background:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2.4rem 1.6rem;padding:.6rem}
.polaroid{background:#fff;padding:.75rem .75rem .9rem;box-shadow:0 6px 14px var(--shadow);position:relative;transform:rotate(var(--r,0deg));transition:transform .2s}
.polaroid:hover{transform:rotate(0) scale(1.03);z-index:2}
.polaroid .tape{top:-13px;left:50%;margin-left:-45px;width:90px;height:26px;transform:rotate(var(--tr,-4deg))}
.cap{font-size:1.45rem;text-align:center;margin-top:.5rem;min-height:1.6rem;outline:none}
.cap:focus{background:rgba(255,216,107,.45)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--soft);opacity:.75}

/* timeline */
.line{position:relative;padding-left:2.4rem;border-left:4px dotted var(--ink);margin-left:.8rem}
.entry{position:relative;display:grid;grid-template-columns:150px 1fr;gap:1.2rem;background:#fff;padding:1rem;margin:0 0 1.8rem;box-shadow:0 5px 12px var(--shadow)}
.entry:nth-child(even){transform:rotate(.7deg)}.entry:nth-child(odd){transform:rotate(-.6deg)}
.entry::before{content:"☁";position:absolute;left:-3.55rem;top:.9rem;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--sky1);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);font-size:1rem}
.entry h3{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:0 0 .2rem;outline:none}
.date{color:var(--soft);outline:none}.entry p{margin:.3rem 0 0;outline:none}
@media (max-width:560px){.entry{grid-template-columns:1fr}.entry .photo{max-width:200px}.page{padding-left:3.3rem}.stitch{left:40px}}

/* sticky notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.8rem}
.note{position:relative;padding:1.5rem 1.1rem 1.1rem;box-shadow:0 5px 10px var(--shadow);transform:rotate(var(--r,0deg));min-height:150px;color:#1f3b57;outline:none;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.pin{position:absolute;left:50%;top:-8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9aa8,#d9344f);box-shadow:0 3px 4px var(--shadow);z-index:2}
.nwrap{position:relative}

/* letter */
.letter{position:relative;max-width:620px;margin:0 auto;padding:2.4rem 1.6rem 1.4rem 3.2rem;background:#fff;box-shadow:0 8px 18px var(--shadow);transform:rotate(.7deg);
  background-image:repeating-linear-gradient(transparent 0 33px,#bcd9f0 33px 34px);line-height:34px;font-size:1.45rem}
.letter::before{content:"";position:absolute;left:2.2rem;top:0;bottom:0;border-left:2px solid #f6a1b5}
.letter p{margin:0;outline:none}
.letter .tape{top:-14px;right:30px;transform:rotate(6deg)}

/* tickets */
.tickets{display:flex;flex-wrap:wrap;gap:1.8rem}
.ticket{display:flex;color:#1f3b57;box-shadow:0 5px 10px var(--shadow);transform:rotate(var(--r,0deg));min-width:260px;flex:1 1 260px;max-width:400px;background:var(--bg,var(--sun));
  -webkit-mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .main{flex:1;padding:.9rem 1.2rem;border-right:3px dashed rgba(31,59,87,.5)}
.ticket .stub{width:76px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;writing-mode:vertical-rl;padding:.4rem}
.ticket div[contenteditable]{outline:none}.ticket .big{font-family:var(--serif);font-size:1.35rem}

button{font:inherit;font-size:1.35rem;background:var(--ink);color:#fff;border:0;border-radius:4px;padding:.5rem 1.4rem;cursor:pointer;box-shadow:3px 3px 0 var(--sun);margin-top:1.6rem}
button:hover{transform:translate(-1px,-1px)}button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
footer{text-align:center;margin-top:1rem;font-size:1.7rem;color:#fff;text-shadow:0 2px 4px var(--shadow);outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="cloud" style="top:70px;left:4%"></div><div class="cloud" style="top:300px;right:3%;transform:scale(1.3)"></div><div class="cloud" style="top:820px;left:-20px;transform:scale(.8)"></div>
<main>
  <header class="cover">
    <span class="tape"></span>
    <div class="cover-in">
      <div class="label torn"><h1 contenteditable spellcheck="false">Marium</h1><p contenteditable spellcheck="false">our little pile of favorite things</p></div>
    </div>
    <span class="sticker" style="left:-14px;top:-18px;transform:rotate(-14deg)">⭐</span>
    <span class="sticker" style="right:-10px;bottom:-16px;transform:rotate(12deg)">🎀</span>
    <span class="sticker" style="right:26px;top:-22px;font-size:3rem">☁️</span>
  </header>

  <section class="page" style="--pr:-.5deg"><span class="stitch"></span>
    <h2 class="sec-title">Us</h2>
    <p class="hint">Tap a photo box to add a picture. Tap a caption to write on it.</p>
    <div class="grid" id="grid"></div>
    <button type="button" id="add">Add a polaroid</button>
    <span class="sticker" style="right:14px;top:-16px;transform:rotate(10deg)">🌤️</span>
  </section>

  <section class="page blue" style="--pr:.5deg"><span class="stitch"></span>
    <h2 class="sec-title">Our firsts</h2>
    <div class="line">
      <article class="entry"><div class="photo"></div><div><span class="date" contenteditable data-ph="Add a date"></span><h3 contenteditable data-ph="First hello"></h3><p contenteditable data-ph="Write what you remember about that day."></p></div></article>
      <article class="entry"><div class="photo"></div><div><span class="date" contenteditable data-ph="Add a date"></span><h3 contenteditable data-ph="First date"></h3><p contenteditable data-ph="Where did you go? What did you order?"></p></div></article>
      <article class="entry"><div class="photo"></div><div><span class="date" contenteditable data-ph="Add a date"></span><h3 contenteditable data-ph="First trip together"></h3><p contenteditable data-ph="The funniest thing that happened."></p></div></article>
    </div>
    <span class="sticker" style="right:18px;bottom:-14px;transform:rotate(-10deg)">✈️</span>
  </section>

  <section class="page gingham" style="--pr:-.4deg"><span class="stitch"></span>
    <h2 class="sec-title">Things I love about you</h2>
    <div class="notes">
      <div class="nwrap"><i class="pin"></i><div class="note" style="background:#fff2a8;--r:-2deg" contenteditable data-ph="Your laugh..."></div></div>
      <div class="nwrap"><i class="pin"></i><div class="note" style="background:#ffd1e0;--r:1.5deg" contenteditable data-ph="The way you..."></div></div>
      <div class="nwrap"><i class="pin"></i><div class="note" style="background:#c9ecff;--r:-1deg" contenteditable data-ph="Something small and specific."></div></div>
      <div class="nwrap"><i class="pin"></i><div class="note" style="background:#d6f5df;--r:2deg" contenteditable data-ph="An inside joke."></div></div>
    </div>
    <span class="sticker" style="left:50px;bottom:-16px">💙</span>
  </section>

  <section class="page" style="--pr:.4deg"><span class="stitch"></span>
    <h2 class="sec-title">A note for you</h2>
    <div class="letter"><span class="tape y"></span><p contenteditable data-ph="Dear Marium, write your letter here."></p></div>
    <span class="sticker" style="right:20px;top:-18px;transform:rotate(8deg)">📎</span>
  </section>

  <section class="page blue" style="--pr:-.3deg"><span class="stitch"></span>
    <h2 class="sec-title">Tickets and keepsakes</h2>
    <div class="tickets">
      <div class="ticket" style="--r:-1.5deg;--bg:var(--sun)"><div class="main"><div class="big" contenteditable data-ph="Movie night"></div><div contenteditable data-ph="Date and place"></div></div><div class="stub">ADMIT ONE</div></div>
      <div class="ticket" style="--r:1deg;--bg:var(--mint)"><div class="main"><div class="big" contenteditable data-ph="Favorite dinner"></div><div contenteditable data-ph="Date and place"></div></div><div class="stub">ADMIT ONE</div></div>
      <div class="ticket" style="--r:-.5deg;--bg:var(--pink)"><div class="main"><div class="big" contenteditable data-ph="Next adventure"></div><div contenteditable data-ph="Date and place"></div></div><div class="stub">ADMIT ONE</div></div>
    </div>
  </section>

  <footer contenteditable data-ph="Forever to be continued."></footer>
</main>

<script>
const ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg>';
const input=document.createElement('input');input.type='file';input.accept='image/*';
let target=null;
function setup(el){el.className='photo';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Add a photo');el.innerHTML=ICON+'<span>Your photo here</span>';}
document.querySelectorAll('.photo').forEach(setup);
document.addEventListener('click',e=>{const p=e.target.closest('.photo');if(p){target=p;input.click();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('photo')){e.preventDefault();e.target.click();}});
input.addEventListener('change',()=>{
  const f=input.files[0];if(!f||!target)return;
  const r=new FileReader();
  r.onload=()=>{target.className='photo filled';target.innerHTML='';const img=new Image();img.src=r.result;img.alt='Scrapbook photo';target.appendChild(img);};
  r.readAsDataURL(f);input.value='';
});
const rots=[-3,2,-1.5,3,-2,1.5],tapes=['','y','p','m'];let n=0;
function addPolaroid(cap){
  const d=document.createElement('div');d.className='polaroid';
  d.style.setProperty('--r',rots[n%rots.length]+'deg');d.style.setProperty('--tr',(n%2?5:-4)+'deg');
  d.innerHTML='<span class="tape '+tapes[n%4]+'"></span><div class="photo"></div><div class="cap" contenteditable data-ph="Write a caption"></div>';
  setup(d.querySelector('.photo'));
  if(cap)d.querySelector('.cap').textContent=cap;
  document.getElementById('grid').appendChild(d);n++;
}
